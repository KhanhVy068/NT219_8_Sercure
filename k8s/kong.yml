apiVersion: v1
kind: ConfigMap
metadata:
  name: kong-declarative-config
  namespace: api-gateway
data:
  kong.yml: |
    _format_version: "3.0"
    _transform: true
    services:
    - name: protected-express-backend
      url: http://backend:3000
      routes:
      - name: protected-cloud-api-routes
        paths:
        - /
        strip_path: false
        preserve_host: true
      plugins:
      - name: correlation-id
        config:
          header_name: x-request-id
          generator: uuid
          echo_downstream: true
      - name: rate-limiting
        config:
          minute: 120
          policy: local
      - name: request-size-limiting
        config:
          allowed_payload_size: 1
          size_unit: megabytes
      - name: cors
    plugins:
    - name: prometheus
      config:
        status_code_metrics: true
        latency_metrics: true
        bandwidth_metrics: true
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kong
  namespace: api-gateway
  labels:
    app: kong
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kong
  template:
    metadata:
      labels:
        app: kong
    spec:
      containers:
      - name: kong
        image: kong:3.8
        ports:
        - containerPort: 8000
        - containerPort: 8001
        env:
        - name: KONG_DATABASE
          value: "off"
        - name: KONG_DECLARATIVE_CONFIG
          value: /kong/declarative/kong.yml
        - name: KONG_ADMIN_LISTEN
          value: 0.0.0.0:8001
        - name: KONG_PROXY_ACCESS_LOG
          value: /dev/stdout
        - name: KONG_PROXY_ERROR_LOG
          value: /dev/stderr
        - name: KONG_ADMIN_ACCESS_LOG
          value: /dev/stdout
        - name: KONG_ADMIN_ERROR_LOG
          value: /dev/stderr
        volumeMounts:
        - name: kong-config
          mountPath: /kong/declarative
          readOnly: true
        readinessProbe:
          httpGet:
            path: /status
            port: 8001
          initialDelaySeconds: 10
          periodSeconds: 10
      volumes:
      - name: kong-config
        configMap:
          name: kong-declarative-config
---
apiVersion: v1
kind: Service
metadata:
  name: kong
  namespace: api-gateway
spec:
  selector:
    app: kong
  ports:
  - name: proxy
    port: 8000
    targetPort: 8000
  - name: admin
    port: 8001
    targetPort: 8001
  type: NodePort
