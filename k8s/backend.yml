apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  namespace: api-gateway
  labels:
    app: gateway
spec:
  replicas: 2
  selector:
    matchLabels:
      app: gateway
  template:
    metadata:
      labels:
        app: gateway
    spec:
      containers:
      - name: gateway
        image: nt219_8_sercure-backend:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 3000
        env:
        - name: KEYCLOAK_ISSUER
          value: "http://keycloak:8080/realms/DOAN"
        - name: KEYCLOAK_JWKS_URI
          value: "http://keycloak:8080/realms/DOAN/protocol/openid-connect/certs"
        livenessProbe:
          httpGet:
            path: /health
            port: 3000
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 3000
          initialDelaySeconds: 5
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: gateway
  namespace: api-gateway
spec:
  selector:
    app: gateway
  ports:
  - port: 3000
    targetPort: 3000
   
  type: NodePort