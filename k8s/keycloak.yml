apiVersion: apps/v1
kind: Deployment
metadata:
  name: keycloak
  namespace: api-gateway
spec:
  replicas: 1
  selector:
    matchLabels:
      app: keycloak
  template:
    metadata:
      labels:
        app: keycloak
    spec:
      containers:
      - name: keycloak
        image: quay.io/keycloak/keycloak:26.1
        args: ["start-dev"]
        ports:
        - containerPort: 8080
        env:
        - name: KC_DB
          value: "postgres"
        - name: KC_DB_URL
          value: "jdbc:postgresql://postgres:5432/keycloak"
        - name: KC_DB_USERNAME
          value: "keycloak"
        - name: KC_DB_PASSWORD
          value: "password"
        - name: KC_BOOTSTRAP_ADMIN_USERNAME
          value: "admin"
        - name: KC_BOOTSTRAP_ADMIN_PASSWORD
          value: "admin"
        - name: KC_HOSTNAME
          value: "localhost"
        - name: KC_HTTP_ENABLED
          value: "true"
---
apiVersion: v1
kind: Service
metadata:
  name: keycloak
  namespace: api-gateway
spec:
  selector:
    app: keycloak
  ports:
  - port: 8080
    targetPort: 8080
  type: NodePort