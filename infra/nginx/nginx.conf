events {}

http {
  upstream kong_gateway {
    server kong:8000;
  }

  upstream keycloak_idp {
  server keycloak:8080;
}

  limit_req_zone $binary_remote_addr zone=api_per_ip:10m rate=10r/s;
  limit_conn_zone $binary_remote_addr zone=conn_per_ip:10m;

  map $http_user_agent $blocked_agent {
    default 0;
    ~*(sqlmap|nikto|nmap|masscan|acunetix|nessus) 1;
  }

  server {
    listen 8443 ssl;
    server_name _;

    ssl_certificate /etc/nginx/certs/gateway.crt;
    ssl_certificate_key /etc/nginx/certs/gateway.key;
    ssl_protocols TLSv1.2;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    client_max_body_size 1m;
    server_tokens off;

    add_header X-Firewall-Layer "nginx-rule-based-firewall" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;

    if ($blocked_agent) {
      return 403;
    }

    location ~ /\.(?!well-known) {
      return 403;
    }

    location / {
      limit_req zone=api_per_ip burst=20 nodelay;
      limit_conn conn_per_ip 20;

      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto https;
      proxy_set_header X-Request-ID $request_id;
      proxy_set_header Connection "";

      proxy_connect_timeout 5s;
      proxy_send_timeout 30s;
      proxy_read_timeout 30s;

      proxy_pass http://kong_gateway;
    }

    location /realms/ {
  proxy_http_version 1.1;

  proxy_set_header Host $host;
  proxy_set_header X-Forwarded-Host $host;
  proxy_set_header X-Forwarded-Proto https;
  proxy_set_header X-Forwarded-Port 443;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

  proxy_pass http://keycloak_idp;
}

location /resources/ {
  proxy_http_version 1.1;

  proxy_set_header Host $host;
  proxy_set_header X-Forwarded-Host $host;
  proxy_set_header X-Forwarded-Proto https;
  proxy_set_header X-Forwarded-Port 443;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

  proxy_pass http://keycloak_idp;
}
  }
}
