global:
  scrape_interval: 10s
  evaluation_interval: 10s

scrape_configs:
  - job_name: kong-gateway
    metrics_path: /metrics
    static_configs:
      - targets:
          - kong:8001

  - job_name: express-secure-gateway
    metrics_path: /metrics/prometheus
    static_configs:
      - targets:
          - backend:3000
