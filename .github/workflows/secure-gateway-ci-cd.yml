name: Secure Gateway CI/CD

on:
  push:
    branches:
      - main
      - master
      - "codex/**"
  pull_request:
  workflow_dispatch:

env:
  IMAGE_NAME: secure-api-gateway

jobs:
  validate-and-scan:
    name: Validate, Audit, and Scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "18"
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        run: npm ci --prefix backend

      - name: Check JavaScript syntax
        run: npm run check:syntax --prefix backend

      - name: Audit npm dependencies
        run: npm audit --prefix backend --audit-level=high

      - name: Validate Docker Compose config
        run: docker compose config

      - name: Scan repository with Trivy
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: fs
          scan-ref: .
          trivy-config: .trivy.yaml
          format: table
          exit-code: "1"

  build-and-image-scan:
    name: Build and Scan Docker Image
    runs-on: ubuntu-latest
    needs: validate-and-scan
    permissions:
      contents: read

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend image
        run: docker build -t "$IMAGE_NAME:${{ github.sha }}" ./backend

      - name: Scan backend image with Trivy
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: ${{ env.IMAGE_NAME }}:${{ github.sha }}
          trivy-config: .trivy.yaml
          format: table
          exit-code: "1"

  deploy-kubernetes:
    name: Deploy Kubernetes Manifests
    runs-on: ubuntu-latest
    needs: build-and-image-scan
    if: github.event_name == 'workflow_dispatch'
    env:
      KUBECONFIG_B64: ${{ secrets.KUBECONFIG_B64 }}

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Skip deploy when kubeconfig is not configured
        if: env.KUBECONFIG_B64 == ''
        run: echo "KUBECONFIG_B64 secret is not set; skipping Kubernetes deployment."

      - name: Configure kubeconfig
        if: env.KUBECONFIG_B64 != ''
        run: |
          mkdir -p "$HOME/.kube"
          echo "$KUBECONFIG_B64" | base64 -d > "$HOME/.kube/config"

      - name: Apply Kubernetes manifests
        if: env.KUBECONFIG_B64 != ''
        run: |
          kubectl apply -f k8s/namespace.yml
          kubectl apply -f k8s/postgres.yml
          kubectl apply -f k8s/keycloak.yml
          kubectl apply -f k8s/backend.yml
          kubectl apply -f k8s/kong.yml
          kubectl rollout status deployment/backend -n api-gateway --timeout=120s
          kubectl rollout status deployment/kong -n api-gateway --timeout=120s
